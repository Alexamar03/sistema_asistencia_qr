<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Asistencia QR</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        
        /* Estilos para la sección de resultado y botones en columna */
        #resultado { margin-top: 25px; text-align: center; display: none; }
        #mensaje-exito { color: #28a745; font-size: 18px; margin-bottom: 15px; }
        #qr-imagen { 
            width: 240px; 
            height: 240px; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            padding: 5px; 
            background: white; 
            margin: 0 auto 15px auto; 
            display: block; 
        }
        .btn-acciones {
            display: flex;
            flex-direction: column; /* Organiza los botones uno debajo del otro */
            gap: 10px;
            margin-top: 15px;
            align-items: center;
        }
        .btn-descargar { 
            display: inline-block; 
            background-color: #28a745; 
            color: white; 
            padding: 12px 15px; 
            text-decoration: none; 
            border-radius: 4px; 
            font-weight: bold; 
            font-size: 14px; 
            width: 85%; 
            text-align: center;
        }
        .btn-descargar:hover { background-color: #218838; }
        .btn-excel {
            background-color: #17a2b8; /* Tono azulado/verdoso profesional para Excel */
        }
        .btn-excel:hover {
            background-color: #138496;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Crear Evento y Generar QR</h2>
    <form id="eventoForm">
        <div class="form-group">
            <label>Título del Evento:</label>
            <input type="text" id="titulo" required placeholder="Ej. Clase de Programación Móvil">
        </div>
        <div class="form-group">
            <label>Descripción:</label>
            <textarea id="descripcion" placeholder="Detalles de la sesión..."></textarea>
        </div>
        <div class="form-group">
            <label>Fecha y Hora del Evento:</label>
            <input type="datetime-local" id="fecha_evento" required>
        </div>
        <div class="form-group">
            <label>Periodo Escolar:</label>
            <input type="text" id="periodo" required placeholder="Ej. 2026-2">
        </div>
        
        <button type="submit">Generar Código QR</button>
    </form>

    <!-- Contenedor del resultado que aparecerá dinámicamente -->
    <div id="resultado">
        <h3 id="mensaje-exito"></h3>
        <img id="qr-imagen" src="" alt="Código QR del Evento">
        
        <!-- Contenedor de botones apilados (uno abajo del otro) -->
        <div class="btn-acciones">
            <a id="btn-descargar" class="btn-descargar" href="" download="codigo_qr_evento.png">📥 Descargar QR</a>
            <a id="btn-excel" class="btn-descargar btn-excel" href="" target="_blank">📊 Descargar Excel de Asistencia</a>
        </div>
    </div>
</div>

<script>
    document.getElementById('eventoForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const datos = {
            titulo: document.getElementById('titulo').value,
            descripcion: document.getElementById('descripcion').value,
            fecha_evento: document.getElementById('fecha_evento').value.replace('T', ' ') + ':00',
            periodo: document.getElementById('periodo').value
        };

        const respuesta = await fetch('/crear-evento', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        });

        const resultado = await respuesta.json();

        if (respuesta.ok) {
            // Mostramos el mensaje de éxito
            document.getElementById('mensaje-exito').innerText = resultado.mensaje;
            
            // Asignamos la ruta del QR a la imagen y al botón de descarga del QR
            const rutaQr = resultado.qr_imagen; 
            document.getElementById('qr-imagen').src = rutaQr;
            document.getElementById('btn-descargar').href = rutaQr;

            // Asignamos el enlace dinámico para descargar el reporte de Excel usando el evento_id
            const eventoId = resultado.evento_id;
            document.getElementById('btn-excel').href = `/exportar-asistencias/${eventoId}`;

            // Hacemos visible toda la caja de resultados
            document.getElementById('resultado').style.display = 'block';
        } else {
            alert('Error: ' + resultado.error);
        }
    });
</script>

</body>
</html>
